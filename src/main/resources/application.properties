# ======================================================
# ? CONFIGURACIÓN GENERAL
# ======================================================
spring.application.name=api-gateway
server.address=0.0.0.0
server.port=8080

spring.cloud.config.enabled=false
spring.cloud.compatibility-verifier.enabled=false

# ======================================================
# ? EUREKA CLIENT
# ======================================================
eureka.instance.instance-id=${spring.application.name}:${random.uuid}

# ? Local
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ======================================================
# ? RUTAS DEL GATEWAY
# ======================================================
# Las rutas del Gateway **NO** usan http://localhost directamente.
# Usan **lb://** (Load Balancer) para que Eureka encuentre el microservicio
# registrado localmente con ese nombre. Los microservicios **deben estar
# registrados en Eureka** para que esto funcione.

# UsuarioApi - Autenticación pública
spring.cloud.gateway.mvc.routes[0].id=usuario-auth
spring.cloud.gateway.mvc.routes[0].uri=lb://usuario-microservice
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/auth/**

# UsuarioApi - Usuarios y Roles (protegida)
spring.cloud.gateway.mvc.routes[1].id=usuario-service
spring.cloud.gateway.mvc.routes[1].uri=lb://usuario-microservice
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/usuarios/**, /api/roles/**

# Ruta para BlogApi (protegida)
spring.cloud.gateway.mvc.routes[2].id=blog-Producto-microservice
spring.cloud.gateway.mvc.routes[2].uri=lb://blog-Producto-microservice
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/blogs/**, /api/productos/**

# ======================================================
# ? JWT (misma clave que microservicios)
# ======================================================
security.jwt.secret-key=Y/I5T3T1aSOP+BezsicbSiUtzIZWxdcOVnylSYlJl/H22uPQID8VGjfzc5U5cVhKA6qm17V2yMP/mlrlTIkb+g==

# URLs de los microservicios (para comunicación directa si es necesario)
# Estas sí usan **http://localhost:PUERTO** directamente.
usuario.api.url=http://localhost:8082
blog.api.url=http://localhost:8081

# ======================================================
# ? LOGGING
# ======================================================
logging.level.com.ApiGateway=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.web=DEBUG

# ======================================================
# ?? SPRING CLOUD LOADBALANCER
# ======================================================
spring.cloud.loadbalancer.ribbon.enabled=false