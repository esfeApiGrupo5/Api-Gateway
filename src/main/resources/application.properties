# ======================================================
# ? CONFIGURACI�N GENERAL
# ======================================================
spring.application.name=api-gateway
server.address=0.0.0.0
server.port=8080

spring.cloud.config.enabled=false
spring.cloud.compatibility-verifier.enabled=false

# ======================================================
# ? EUREKA CLIENT
# ======================================================
eureka.instance.instance-id=${spring.application.name}:${random.uuid}
eureka.client.service-url.defaultZone=https://eureka-server-1jnn.onrender.com/eureka/

# ? Nube (Render)
# eureka.client.service-url.defaultZone=https://eureka-server-1jnn.onrender.com/eureka/

# ======================================================
# ? RUTAS DEL GATEWAY
# ======================================================
# UsuarioApi - Autenticaci�n p�blica
spring.cloud.gateway.mvc.routes[0].id=usuario-auth
spring.cloud.gateway.mvc.routes[0].uri=lb://usuario-microservice
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/auth/**

# UsuarioApi - Usuarios y Roles (protegida)
spring.cloud.gateway.mvc.routes[1].id=usuario-service
spring.cloud.gateway.mvc.routes[1].uri=lb://usuario-microservice
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/usuarios/**, /api/roles/**

# Ruta para BlogApi (protegida)
spring.cloud.gateway.mvc.routes[2].id=blog-Producto-microservice
spring.cloud.gateway.mvc.routes[2].uri=https://blogapi-o9r4.onrender.com
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/blogs/**, /api/productos/**

